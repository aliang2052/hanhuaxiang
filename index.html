<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1d1c18" />
  <meta name="color-scheme" content="dark" />
  <title>汉画像·百戏乐舞｜63格实时互动乐队</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="stage" aria-label="汉画像互动乐队">
    <canvas id="artCanvas" width="1920" height="1080"></canvas>

    <section id="intro" class="intro-card" aria-live="polite">
      <div class="seal">樂</div>
      <p class="eyebrow">LIVING PORTRAIT STONE</p>
      <h1>汉画像·百戏乐舞</h1>
      <p class="intro-copy">你的身体会唤醒 63 个格子里的乐师、舞者与礼乐声部。</p>
      <button id="enterButton" class="primary">进入作品</button>
      <p class="small">默认先进入自动演示；切换“摄像头”后，可采集空场背景并进行真人触发。</p>
    </section>

    <div id="topBar" class="top-bar hidden-ui">
      <div class="brand"><span class="brand-seal">樂</span><span>汉画像·百戏乐舞</span></div>
      <div class="status-row">
        <span id="modeStatus" class="status-pill">自动演示</span>
        <span id="activeStatus" class="status-pill">0 / 63</span>
        <span id="fpsStatus" class="status-pill">0 FPS</span>
      </div>
    </div>

    <aside id="controlPanel" class="control-panel hidden-ui" aria-label="控制面板" hidden>
      <div class="panel-head">
        <div>
          <div class="panel-kicker">INSTALLATION CONTROL</div>
          <h2>运行与标定</h2>
        </div>
        <button id="closePanel" class="icon-button" title="关闭面板">×</button>
      </div>

      <label class="field">
        <span>触发来源</span>
        <select id="modeSelect">
          <option value="auto">自动演示</option>
          <option value="pointer">鼠标 / 触摸</option>
          <option value="camera">摄像头</option>
        </select>
      </label>

      <div class="button-grid">
        <button id="cameraButton">开启摄像头</button>
        <button id="captureBackgroundButton">采集空场背景</button>
        <button id="debugButton">摄像头标定</button>
        <button id="fullscreenButton">全屏投影</button>
      </div>

      <label class="slider-field">
        <span>前景灵敏度 <output id="diffThresholdOutput">54</output></span>
        <input id="diffThreshold" type="range" min="18" max="120" value="54" />
      </label>
      <label class="slider-field">
        <span>格子开启阈值 <output id="onThresholdOutput">7%</output></span>
        <input id="onThreshold" type="range" min="1" max="30" value="7" />
      </label>
      <label class="slider-field">
        <span>格子关闭阈值 <output id="offThresholdOutput">3%</output></span>
        <input id="offThreshold" type="range" min="1" max="20" value="3" />
      </label>

      <div class="toggle-grid">
        <label><input id="mirrorToggle" type="checkbox" checked /> 镜像摄像头</label>
        <label><input id="gridToggle" type="checkbox" /> 显示触发格</label>
        <label><input id="labelsToggle" type="checkbox" /> 显示编号</label>
        <label><input id="muteToggle" type="checkbox" /> 静音</label>
      </div>

      <div class="button-grid bottom-actions">
        <button id="wakeAllButton">唤醒全乐队</button>
        <button id="resetButton">恢复默认设置</button>
      </div>
      <p id="panelMessage" class="panel-message">空格：播放/暂停自动演示　D：标定　H：隐藏界面　F：全屏</p>
    </aside>

    <section id="debugView" class="debug-view" hidden>
      <div class="debug-head">
        <div>
          <p>CAMERA CALIBRATION</p>
          <h2>摄像头与 63 格触发区</h2>
        </div>
        <button id="closeDebug" class="icon-button">×</button>
      </div>
      <canvas id="debugCanvas" width="960" height="540"></canvas>
      <div class="debug-copy">
        <p><strong>使用步骤：</strong>固定摄像头 → 确保画面无人 → 点击“采集空场背景” → 人进入后红色前景应覆盖身体。拖动四个角点可标定有效区域。</p>
        <div class="debug-buttons">
          <button id="debugCaptureButton">采集空场背景</button>
          <button id="resetQuadButton">重置四角</button>
        </div>
      </div>
    </section>

    <button id="openPanel" class="floating-control hidden-ui" title="打开控制面板">控</button>
    <button id="audioButton" class="floating-audio hidden-ui" title="声音开关">声</button>

    <video id="cameraVideo" autoplay muted playsinline></video>
    <canvas id="inputCanvas" width="192" height="108"></canvas>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
